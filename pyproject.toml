[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pcpulse"
version = "0.1.2"
description = "Privacy-first cross-platform PC diagnostics library and CLI."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Matthew Para" }]
keywords = ["diagnostics", "system", "hardware", "pc", "cli", "privacy"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Operating System :: OS Independent"]
dependencies = ["psutil>=5.9,<8"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "types-psutil", "jsonschema>=4.18"]

[project.scripts]
pcpulse = "pcpulse.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pcpulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.10"
strict = true
