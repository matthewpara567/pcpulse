name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: pytest -q
      - run: ruff check .
      - run: mypy src
      - name: Build distribution and check package metadata
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Verify installed wheel includes the schema resource
        run: |
          python -m pip install --no-deps dist/*.whl
          python -c "from importlib.resources import files; assert files('pcpulse').joinpath('schemas/snapshot-1.2.schema.json').is_file()"
